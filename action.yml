name: Diffly PR triage
description: Analyze a pull request with diffly-cli and maintain one verdict comment
inputs:
  token:
    description: GitHub token with contents:read and pull-requests:write permissions
    required: true
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install diffly-cli
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"
    - name: Analyze pull request
      id: analyze
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ "${{ github.event_name }}" != "pull_request" ]]; then
          echo "Diffly PR triage only supports pull_request events; skipping."
          exit 0
        fi
        explain_args=()
        if [[ -n "${DIFFLY_LLM_API_KEY:-}" || -n "${OPENAI_API_KEY:-}" ]]; then
          explain_args+=(--explain)
        fi
        # Give other checks a moment to register their pending status
        sleep 10
        diffly-cli pr "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}" \
          --token "$GITHUB_TOKEN" --json "${explain_args[@]}" > "$RUNNER_TEMP/diffly-result.json"
        python "$GITHUB_ACTION_PATH/action/format_comment.py" "$RUNNER_TEMP/diffly-result.json" > "$RUNNER_TEMP/diffly-comment.md"
        python "$GITHUB_ACTION_PATH/action/post_comment.py" \
          "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}" \
          "$RUNNER_TEMP/diffly-comment.md"
    - name: Publish result in job summary
      if: always() && steps.analyze.outcome == 'success' && github.event_name == 'pull_request'
      shell: bash
      run: cat "$RUNNER_TEMP/diffly-comment.md" >> "$GITHUB_STEP_SUMMARY"
branding:
  icon: shield
  color: purple
